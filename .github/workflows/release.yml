name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify tag matches package version
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
          if (!semver.test(packageJson.version)) throw new Error(`invalid package version ${packageJson.version}`)
          const expected = `v${packageJson.version}`
          if (process.env.GITHUB_REF_NAME !== expected) throw new Error(`release tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`)
          NODE
      - run: npm ci
      - run: npm run release:check
      - name: Generate source inventory
        run: |
          mkdir -p release
          node scripts/update-source-manifest.mjs --output release/SOURCE-MANIFEST.json
      - name: Build package
        run: |
          npm pack --pack-destination release
          (cd release && sha256sum oont-*.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Verify package checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Attest package
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/oont-*.tgz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          release_args=("$GITHUB_REF_NAME" release/oont-*.tgz release/SHA256SUMS release/SOURCE-MANIFEST.json)
          release_args+=(--title "OpenOntology ${GITHUB_REF_NAME#v}" --verify-tag --notes-file "$notes_file")
          version="${GITHUB_REF_NAME#v}"
          if [[ "${version%%+*}" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "${release_args[@]}"
