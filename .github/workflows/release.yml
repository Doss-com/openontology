name: Release

on:
  push:
    tags:
      - 'v*.*.*-alpha.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        run: |
          node <<'NODE'
          const expected = `v${require('./package.json').version}`
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`release tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`)
          }
          NODE
      - run: npm ci
      - run: npm run release:check
      - name: Build package
        run: |
          npm pack
          sha256sum oont-*.tgz > SHA256SUMS
      - name: Attest package
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: oont-*.tgz
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            oont-*.tgz SHA256SUMS \
            --prerelease \
            --verify-tag \
            --generate-notes
